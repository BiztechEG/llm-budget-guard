[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-budget-guard"
version = "0.1.0.dev0"
description = "Per-user, per-feature and daily spend limits for OpenAI and Anthropic SDK calls."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
budget_guard = ["pricing.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
